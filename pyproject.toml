[project]
name = "editrace"
version = "0.0.0"
description = "Editrace Python code: the shared template models, the analysis workers and the exporters."
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

# Not an installable package: the folders below are plain top-level packages, imported from the repo root
# (`from editrace_schema import Template`). CI runs `uv sync`, `ruff`, `pyright` and `pytest` from the root.
[dependency-groups]
dev = [
  "datamodel-code-generator",
  "pyright",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["editrace_schema", "workers", "exporters"]

[tool.ruff]
# Generated by `make codegen`, in the generator's own style. Never edit or reformat by hand.
extend-exclude = ["editrace_schema/models.py", "editrace_schema/reader_models.py"]

[tool.pyright]
include = ["editrace_schema", "workers", "exporters"]
