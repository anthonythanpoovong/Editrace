[project]
name = "editrace"
version = "0.0.0"
description = "Editrace Python code: the shared template models, the analysis workers and the exporters."
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

# Per-worker dependencies, pinned because detector output can change between releases (ADR 0003).
# CI installs every extra (`uv sync --all-extras`).
[project.optional-dependencies]
cuts = ["scenedetect==0.7.2", "opencv-python==5.0.0.93"]  # scenedetect requires opencv-python; pin it too
# The Modal app (workers/modal_app.py); the same version deploy.yml installs to deploy it (#302).
deploy = ["modal==1.6.1"]

# Not an installable package: the folders below are plain top-level packages, imported from the repo root
# (`from editrace_schema import Template`). CI runs `uv sync`, `ruff`, `pyright` and `pytest` from the root.
[dependency-groups]
dev = [
  "datamodel-code-generator",
  "pyright",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["editrace_schema", "workers", "exporters", "eval"]

[tool.ruff]
# Generated by `make codegen`, in the generator's own style. Never edit or reformat by hand.
# scripts/armour-eval/cases: the Armour eval's deliberately buggy bait code (#128), never run or imported.
extend-exclude = [
  "editrace_schema/models.py",
  "editrace_schema/reader_models.py",
  "scripts/armour-eval/cases",
]

[tool.pyright]
include = ["editrace_schema", "workers", "exporters"]
