name: Discord review request

# When a PR is ready for review, ask the team for a review in Discord (#140). Drafts never post.
# Deterministic: title, author, link, size and a 1-2 line excerpt of the PR body. No model involved.
# Not a required check and not part of ci-ok: a failed post, or a failure to save its marker, shows as a red X and
# comments on the PR.
# The Discord message id is saved in a PR comment so discord-review-ack.yml can mark it reviewed.
# Needs: secret DISCORD_REVIEW_WEBHOOK (webhook URL), variable DISCORD_REVIEW_ROLE_ID (role to ping).
#
# The scripts always come from the default branch, never from the PR, so a PR cannot swap in a
# script that runs with the webhook secret. The workflow file itself still comes from the PR merge
# ref; same-repo PR authors have write access, which the repo treats as trusted (plan.md risks).

on:
  pull_request:
    # opened covers PRs created ready; ready_for_review covers drafts that get promoted. synchronize is a
    # safety net for an opened event GitHub dropped: the next push posts the request, and the check job
    # makes sure a PR is only ever announced once.
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: discord-review-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  # A PR already announced (its message-id comment exists) is not announced again on a push. A promoted
  # draft is announced on ready_for_review even if it was announced before, as it always was.
  check:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      post: ${{ steps.seen.outputs.post }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Trusted scripts only: the default branch, not the PR merge ref.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - id: seen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$ACTION" != synchronize ]; then echo "post=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Until this script is on the default branch, a push can't tell, so it doesn't announce.
          if [ ! -x .github/scripts/discord-review-announced.sh ]; then
            echo "::warning::discord-review-announced.sh is not on the default branch yet; not announcing on push"
            echo "post=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A failed fetch must fail this job (it does: no pipe, so errexit applies). Reading it as "no marker"
          # would announce the PR again.
          comments=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | {login: .user.login, body: .body}')
          rc=0
          printf '%s\n' "$comments" | .github/scripts/discord-review-announced.sh || rc=$?
          case "$rc" in
            0) echo "post=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "post=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not read the PR comments to see whether it was announced"; exit 1 ;;
          esac

  notify:
    needs: check
    # No drafts. No forks or Dependabot (neither can read the secret).
    if: >
      needs.check.outputs.post == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      message_id: ${{ steps.post.outputs.message_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Trusted scripts only: the default branch, not the PR merge ref.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      # PR title and body are untrusted: they reach the script through env only, never the shell.
      - name: Post to Discord
        id: post
        env:
          WEBHOOK: ${{ secrets.DISCORD_REVIEW_WEBHOOK }}
          ROLE_ID: ${{ vars.DISCORD_REVIEW_ROLE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$WEBHOOK" =~ ^https://(discord|discordapp)\.com/api/webhooks/ ]] \
            || { echo "::error::DISCORD_REVIEW_WEBHOOK is missing or not a Discord webhook URL"; exit 1; }
          .github/scripts/discord-review-payload.sh > payload.json
          # wait=true makes Discord return the created message, whose id the record job saves.
          curl --fail --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            --data @payload.json "$WEBHOOK?wait=true" > response.json
          echo "message_id=$(jq -r '.id // empty' response.json)" >> "$GITHUB_OUTPUT"
          echo "Posted review request for PR #$PR_NUMBER"

  # Saves the Discord message id on the PR so the review-ack workflow can find the message, and so a later
  # push knows the PR was announced (the check job looks for this comment). If it can't be saved, the next push
  # would announce the PR again, so it retries, and the fallback job warns if it still fails.
  record:
    needs: notify
    if: needs.notify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Save the message id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MESSAGE_ID: ${{ needs.notify.outputs.message_id }}
        run: |
          [[ "$MESSAGE_ID" =~ ^[0-9]+$ ]] || { echo "::error::Discord did not return a message id"; exit 1; }
          for attempt in 1 2 3; do
            gh pr comment "$PR" --repo "$REPO" \
              --body "Review requested in Discord. <!-- discord-review-message:$MESSAGE_ID -->" && exit 0
            echo "::warning::Saving the message id failed (attempt $attempt of 3)"
            sleep $((attempt * 5))
          done
          exit 1

  # Only this job and record can write to the PR. It runs when the post failed, so a dead webhook surfaces on
  # the PR instead of as a silently quiet channel, and when the post worked but record could not save its
  # marker, which would otherwise show only as a repeat announcement on the next push.
  fallback:
    needs: [notify, record]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          NOTIFY_RESULT: ${{ needs.notify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$NOTIFY_RESULT" = success ]; then
            body="The Discord review request was posted, but saving its marker on this PR failed. The next push will announce this PR again, and no review checkmark will be added. Re-run the failed job to save it. ([workflow run]($RUN_URL))"
          else
            body="Discord review request failed. Please ping reviewers manually. ([workflow run]($RUN_URL))"
          fi
          gh pr comment "$PR" --repo "$REPO" --body "$body"
