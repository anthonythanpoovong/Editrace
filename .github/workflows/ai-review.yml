name: Sequa Armour (AI review)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: armour-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Advisory only: never make this a required check. Runs on drafts; skips forks (they can't read the token).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            COMMIT: ${{ github.event.pull_request.head.sha }}
            DRAFT: ${{ github.event.pull_request.draft }}

            You are Sequa Armour, the automated reviewer for this repo.
            Read .github/armour.md and follow it exactly. Also read docs/plan.md for project context.
            The PR branch is checked out in the current working directory. Use `gh pr diff` to see the changes.

            Post exactly one top-level comment with `gh pr comment`, in the format armour.md defines.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for findings tied to specific lines.
            Only post GitHub comments; don't reply with review text as a message.
          claude_args: |
            --model claude-haiku-4-5-20251001
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
