name: Deploy

# Staging deploys automatically when a merge lands on main; prod is a manual run of this workflow (#48).
# PR previews are deployed here too, not by Vercel's Git integration: on Hobby it refuses commits from anyone who
# isn't a member of the Vercel team, which blocks every collaborator. web/vercel.json turns the integration's deploys off.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [production]
        default: production

permissions:
  contents: read

env:
  # Pinned: these jobs hold VERCEL_TOKEN, so bump the CLI deliberately in a PR, never via @latest.
  VERCEL_CLI_VERSION: 62.2.0
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Same convention as ci.yml: stay a no-op until web/ has an app, so this can merge before the app does.
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - id: d
        run: |
          [ -e web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  # Same-repo PRs only: fork PRs can't read the Vercel secrets. The deploy runs under the token's owner, so the
  # commit author doesn't need a Vercel seat. Anyone with write access can edit this workflow in their branch and
  # read the secrets, which is already true of every secret in the repo.
  preview:
    needs: detect
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # One sticky comment per PR, updated on every push.
      - name: Post the preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          MARKER: "<!-- vercel-preview -->"
        run: |
          body="$MARKER
          🔍 Preview for \`${SHA:0:7}\`: $URL"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains(env.MARKER))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

  staging:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      # Hobby has no custom environments, so staging is a preview build aliased to a stable URL.
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          if [ -n "${STAGING_ALIAS:-}" ]; then
            # Not `vercel alias set`: it looks up the token's user first, and this token can't read one
            # ("User not found", with or without --scope). The REST API only needs the team id.
            api=https://api.vercel.com
            id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
            curl -fsS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "{\"alias\":\"$STAGING_ALIAS\"}" "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" >/dev/null
            url="https://$STAGING_ALIAS"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          STAGING_ALIAS: ${{ vars.STAGING_ALIAS }}

  production:
    needs: detect
    if: github.event_name == 'workflow_dispatch' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The Production environment only accepts protected branches, so run this from main.
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
