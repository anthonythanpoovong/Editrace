name: Deploy

# Staging deploys automatically when a merge lands on main; prod is a manual run of this workflow (#48).
# PR previews come from the Vercel GitHub integration, not from here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [production]
        default: production

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Same convention as ci.yml: stay a no-op until web/ has an app, so this can merge before the app does.
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - id: d
        run: |
          [ -e web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  staging:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      # Hobby has no custom environments, so staging is a preview build aliased to a stable URL.
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          if [ -n "${STAGING_ALIAS:-}" ]; then
            vercel alias set "$url" "$STAGING_ALIAS" --token="$VERCEL_TOKEN"
            url="https://$STAGING_ALIAS"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          STAGING_ALIAS: ${{ vars.STAGING_ALIAS }}

  production:
    needs: detect
    if: github.event_name == 'workflow_dispatch' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The Production environment only accepts protected branches, so run this from main.
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
