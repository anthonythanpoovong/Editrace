name: Deploy

# Two Vercel projects: editrace-np holds PR previews and staging, editrace-prod holds production (#48).
# Staging deploys automatically when a merge lands on main. Production is a manual run that promotes a commit
# already live on staging: staging records a `deployed/staging` commit status, and the prod run refuses any commit without it.
# Separate projects can't share a build (env vars like NEXT_PUBLIC_* are baked in at build time), so promoting
# means rebuilding that exact commit with production's env vars.
# PR previews are deployed here too, not by Vercel's Git integration: on Hobby it refuses commits from anyone who
# isn't a member of the Vercel team, which blocks every collaborator. web/vercel.json turns the integration's deploys off.
# Vercel still marks a deployment BLOCKED when the commit's author isn't on the team, even from the CLI. Vercel must never
# fail or hang a collaborator's push, so vercel-deploy.sh reports BLOCKED and the preview and staging jobs end green
# with a note. Only production, which the owner runs by hand, fails on it. Vercel Pro seats are the real fix.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote to production (blank = the newest commit live on staging)
        type: string
        default: ""

permissions:
  contents: read

env:
  # Pinned: these jobs hold VERCEL_TOKEN, so bump the CLI deliberately in a PR, never via @latest.
  VERCEL_CLI_VERSION: 62.2.0
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  # Same convention as ci.yml: stay a no-op until web/ has an app, so this can merge before the app does.
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - id: d
        run: |
          [ -e web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  # Same-repo PRs only: fork PRs can't read the Vercel secrets. The deploy runs under the token's owner, but Vercel
  # still blocks it when the commit's author isn't on the team: that ends as a note on the PR, not a failure.
  # Anyone with write access can edit this workflow in their branch and read the secrets, which is already true of
  # every secret in the repo.
  preview:
    needs: detect
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_NP }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - id: deploy
        run: .github/scripts/vercel-deploy.sh
      # One sticky comment per PR, updated on every push.
      - name: Post the preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          STATE: ${{ steps.deploy.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- vercel-preview -->"
        run: |
          case "$STATE" in
            READY) text="🔍 Preview for \`${SHA:0:7}\`: $URL" ;;
            BLOCKED) text="⚠️ No preview for \`${SHA:0:7}\`: Vercel blocks deploys of commits whose author isn't on the Vercel team (Hobby has no seats). Nothing is wrong with this PR, and CI is unaffected." ;;
            *) text="❌ The preview for \`${SHA:0:7}\` didn't finish ($STATE). See the [run log]($RUN_URL)." ;;
          esac
          body=$(printf '%s\n%s' "$MARKER" "$text")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains(env.MARKER))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
      # BLOCKED is expected for collaborators; anything else that isn't READY is a real problem.
      - name: Fail if the preview broke
        if: steps.deploy.outputs.state != 'READY' && steps.deploy.outputs.state != 'BLOCKED'
        run: |
          echo "Deployment state: ${{ steps.deploy.outputs.state }}"
          exit 1

  staging:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_NP }}
    permissions:
      contents: read
      statuses: write
    environment:
      name: staging
      url: ${{ steps.alias.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      # Staging is a preview-environment build in editrace-np, aliased to a stable URL.
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - id: deploy
        run: .github/scripts/vercel-deploy.sh
      - id: alias
        if: steps.deploy.outputs.state == 'READY'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          STAGING_ALIAS: ${{ vars.STAGING_ALIAS }}
        run: |
          url=$URL
          if [ -n "${STAGING_ALIAS:-}" ]; then
            # Not `vercel alias set`: it looks up the token's user first, and this token can't read one
            # ("User not found", with or without --scope). The REST API only needs the team id.
            api=https://api.vercel.com
            id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
            curl -fsS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "{\"alias\":\"$STAGING_ALIAS\"}" "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" >/dev/null
            url="https://$STAGING_ALIAS"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # This is what lets the production run promote this commit. BLOCKED never gets here, so a commit that
      # never reached staging can't be promoted.
      - name: Mark the commit as live on staging
        if: steps.deploy.outputs.state == 'READY'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.alias.outputs.url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=deployed/staging -f target_url="$URL" -f description="Live on staging" >/dev/null
      # The latest commit on main was written by someone without a Vercel seat, so staging stays on the last good build.
      - name: Staging not updated
        if: steps.deploy.outputs.state == 'BLOCKED'
        run: |
          echo "::warning title=Staging not updated::Vercel blocked this deploy because the commit author isn't on the Vercel team (Hobby has no seats). Staging still serves the previous build."
      - name: Fail if the deploy broke
        if: steps.deploy.outputs.state != 'READY' && steps.deploy.outputs.state != 'BLOCKED'
        run: |
          echo "Deployment state: ${{ steps.deploy.outputs.state }}"
          exit 1

  production:
    needs: detect
    if: github.event_name == 'workflow_dispatch' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PROD }}
    permissions:
      contents: read
    # The Production environment only accepts protected branches, so run this from main.
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Pick the commit to promote and check it really is live on staging before building anything.
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          # Newest status first; sed (not head) reads every page so pipefail never sees a closed pipe.
          staged() { gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$1/statuses" \
            --jq '.[] | select(.context == "deployed/staging") | .state' | sed -n 1p; }
          sha=$INPUT_SHA
          if [ -z "$sha" ]; then
            for c in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&per_page=30" --jq '.[].sha'); do
              [ "$(staged "$c")" = success ] && { sha=$c; break; }
            done
          fi
          if [ -z "$sha" ]; then
            echo "::error::None of the last 30 commits on main is live on staging, so there is nothing to promote."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .sha)
          if [ "$(staged "$sha")" != success ]; then
            echo "::error::${sha:0:7} was never deployed to staging. Merge it to main and let the staging deploy go green first."
            exit 1
          fi
          echo "Promoting $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pick.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: .github/scripts/vercel-deploy.sh --prod
      # Unlike preview and staging, a blocked prod deploy is a failure: the owner asked for it by hand.
      - name: Fail unless the deploy is live
        if: steps.deploy.outputs.state != 'READY'
        run: |
          echo "::error::Production deploy ended as ${{ steps.deploy.outputs.state }}. BLOCKED means Vercel rejected the commit author: promote a commit authored by a Vercel team member."
          exit 1
