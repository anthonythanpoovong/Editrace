name: Project carry-over

# Moves unfinished cards (Status Backlog or In progress, issue still open) from the previous sprint
# into the current one on the Editrace project board. Done and closed cards stay in the sprint they
# finished in. Manual on purpose: run it when a sprint ends, with dry_run first if you want a preview.
# Needs the same PROJECT_TOKEN secret as project-intake.yml (see CONTRIBUTING.md).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would move
        type: boolean
        default: false

permissions: {}

env:
  PROJECT_OWNER: anthonythanpoovong
  PROJECT_NUMBER: "2"

jobs:
  carryover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - name: Carry unfinished cards into the current sprint
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::PROJECT_TOKEN is not set"; exit 1; }
          .github/scripts/project-carryover.sh
