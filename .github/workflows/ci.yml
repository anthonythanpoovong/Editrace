name: CI

on:
  pull_request:
    # ready_for_review: CI skips drafts (Actions minutes) and runs when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Draft PRs get no CI at all, to save Actions minutes: it runs when the PR is marked ready. The Armour eval's draft PRs
  # (#128) are the exception, because Armour waits for their CI. Every job below needs detect, so skipping it skips them.
  # Also scans for secrets (gitleaks) here, so that costs no job of its own.
  detect:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || startsWith(github.head_ref, 'armour-eval/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the PR's changed files, for the docs-only skip
    outputs:
      code: ${{ steps.d.outputs.code }}
      schema: ${{ steps.d.outputs.schema }}
      web: ${{ steps.d.outputs.web }}
      python: ${{ steps.d.outputs.python }}
      codegen: ${{ steps.d.outputs.codegen }}
      supabase: ${{ steps.d.outputs.supabase }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks scans the PR's commits
      # Jobs switch on as each part of the monorepo gains real code.
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          flag() { [ -e "$2" ] && echo "$1=true" >> "$GITHUB_OUTPUT" || echo "$1=false" >> "$GITHUB_OUTPUT"; }
          flag schema schema/template.schema.json
          flag web web/package.json
          flag python pyproject.toml
          flag codegen Makefile
          [ -e supabase/config.toml ] && supabase=true || supabase=false
          # A PR that only touches Markdown at the repo root or under docs/ skips the heavy jobs below (Actions minutes).
          # ci-ok still runs, so the required check still reports. docs/schema.md is code here: check-docs.sh reads it.
          # Pushes to main always run everything (they record the coverage baseline). If the file list can't be read,
          # run everything.
          # The Supabase job (the longest) runs on a PR only if the PR touches the database, the RLS check or this file.
          code=true
          if [ "$EVENT_NAME" = pull_request ] && files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)') && [ -n "$files" ]; then
            non_docs=$(printf '%s\n' "$files" | grep -vE '^(docs/.*\.md|[^/]+\.md)$' || true)
            schema_doc=$(printf '%s\n' "$files" | grep -x 'docs/schema.md' || true)
            [ -z "$non_docs" ] && [ -z "$schema_doc" ] && code=false
            db_files=$(printf '%s\n' "$files" | grep -E '^(supabase/|\.github/scripts/(test-)?check-rls-tests\.sh$|\.github/workflows/ci\.yml$)' || true)
            [ -n "$db_files" ] || supabase=false
            echo "Changed files: $(printf '%s\n' "$files" | wc -l); code=$code supabase=$supabase"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Unit tests for the CI helper scripts (e.g. the Discord review payload's @-defusing, #140).
  # Also lints the workflow files themselves (syntax, expressions, shellcheck on run: steps; added with deploy.yml, #48)
  # and validates the template schema. They share a job because every job is billed for at least a minute.
  scripts:
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # test-coverage-gate.sh runs the real diff-cover (#129). Same pin as the coverage job.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: |
          uv tool install diff-cover==10.6.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: .github/scripts/test-discord-review-payload.sh
      - run: .github/scripts/test-discord-review-ack.sh
      - run: .github/scripts/test-discord-review-comment.sh
      - run: .github/scripts/test-discord-review-announced.sh
      - run: .github/scripts/test-sync-docs-paths.sh
      - run: .github/scripts/test-project-intake.sh
      - run: .github/scripts/test-project-carry-over.sh
      - run: .github/scripts/test-project-done.sh
      - run: .github/scripts/test-discord-pr-status.sh
      - run: .github/scripts/test-discord-reminders.sh
      - run: .github/scripts/test-vercel-deploy.sh
      - run: .github/scripts/test-check-rls-tests.sh
      - run: .github/scripts/test-check-impeccable-sync.sh
      - name: The two vendored impeccable copies have the same files and versions
        run: .github/scripts/check-impeccable-sync.sh
      - run: .github/scripts/test-coverage-exemption.sh
      - run: .github/scripts/test-coverage-gate.sh
      - run: .github/scripts/test-coverage-decide.sh
      - run: .github/scripts/test-coverage-comment.sh
      - run: .github/scripts/test-armour-inputs.sh
      - run: .github/scripts/test-armour-render.sh
      # Armour eval PRs run CI on a base branch without scripts/armour-eval (#128). Skip only there, so a
      # renamed or missing test fails everywhere else.
      - if: "!startsWith(github.head_ref, 'armour-eval/')"
        run: scripts/armour-eval/test-score.sh
      - uses: actions/setup-python@v5
        if: needs.detect.outputs.schema == 'true'
        with:
          python-version: "3.11"
      - if: needs.detect.outputs.schema == 'true'
        run: pip install check-jsonschema
      - name: Schema is valid JSON Schema
        if: needs.detect.outputs.schema == 'true'
        run: check-jsonschema --check-metaschema schema/template.schema.json
      - name: Examples validate against the schema
        if: needs.detect.outputs.schema == 'true'
        run: |
          shopt -s nullglob
          files=(schema/examples/*.json)
          [ ${#files[@]} -eq 0 ] && { echo "no examples yet"; exit 0; }
          check-jsonschema --schemafile schema/template.schema.json "${files[@]}"
      - name: Invalid fixtures are rejected, for the right reason
        if: needs.detect.outputs.schema == 'true'
        run: |
          [ -d schema/examples/invalid ] || { echo "no invalid fixtures yet"; exit 0; }
          schema/check-invalid.sh
      - name: Every schema field is documented
        if: needs.detect.outputs.schema == 'true'
        run: schema/check-docs.sh
      - name: Test vectors match the reference implementation
        if: needs.detect.outputs.schema == 'true'
        run: schema/check-vectors.sh
      # Pinned release with a checksum, not the unpinned download script. Bump both together.
      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - run: ./actionlint -color

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true' && needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        if: needs.detect.outputs.codegen == 'true'
      - run: npm ci
      # Codegen shares this job (billing is per job, minimum a minute). It runs before the tests, which write untracked
      # coverage files. Also fails on a generated file that was never committed, which `git diff` alone misses.
      - name: Generated code is up to date
        if: needs.detect.outputs.codegen == 'true'
        working-directory: .
        run: |
          make codegen
          test -z "$(git status --porcelain)" || { git status --short; git diff --stat; echo "::error::Generated code is stale. Run 'make codegen' and commit."; exit 1; }
      # No --if-present: once web/ exists it must define lint, typecheck and test scripts (#48). Otherwise a
      # missing script passes silently, and the changed-line coverage gate (#129) gets no data.
      - run: npm run lint
      - run: npm run typecheck
      # The coverage settings are in web/vitest.config.ts; this writes web/coverage/lcov.info for the gate (#129).
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          retention-days: 7

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true' && needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Python typecheck (#48). Whoever creates pyproject.toml (likely #2) must add pyright as a dev dependency
      # (e.g. `uv add --dev pyright`), or this step fails. Pyright was picked over mypy because it checks the
      # generated Pydantic models without a plugin or extra config.
      - run: uv run pyright
      # pytest-cov is added for this run only, so pyproject.toml needn't list it. .github/coveragerc makes the
      # report's paths relative to the repo root, which is what the changed-line gate matches (#129).
      - run: uv run --with pytest-cov pytest --cov --cov-config=.github/coveragerc --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml
          retention-days: 7

  # Changed-line coverage (#129): measures the lines this PR changes against the web and Python coverage reports and
  # publishes the numbers (job summary, one sticky "Coverage" PR comment). It never fails over low coverage: the
  # decision, with the owner's /coverage-exempt review, is made in ci-ok, because the owner exempts a PR by
  # re-running the failed ci-ok job and a re-run of ci-ok does not re-run this job. On main it records the overall
  # number that PRs compare with.
  coverage:
    needs: [web, python]
    if: always() && (needs.web.result == 'success' || needs.python.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the sticky comment (a fork PR's read-only token only gets a warning)
      actions: read # main's last coverage summary, for "change vs main"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # diff-cover compares with origin/main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: |
          uv tool install diff-cover==10.6.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Either job can be skipped (no web/ or no Python code yet): download only the reports that exist.
      - uses: actions/download-artifact@v4
        if: needs.web.result == 'success'
        with:
          name: coverage-web
          path: coverage-in/web
      - uses: actions/download-artifact@v4
        if: needs.python.result == 'success'
        with:
          name: coverage-python
          path: coverage-in/python
      - name: Main's last coverage, for the change vs main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] && gh run download "$run_id" --name coverage-summary --dir coverage-base
      - name: Measure changed-line coverage
        env:
          WEB_LCOV: coverage-in/web/lcov.info
          PY_XML: coverage-in/python/coverage.xml
          COMPARE_BRANCH: origin/main
          FAIL_UNDER: "80"
          # Generated from schema/template.schema.json (#2). Patterns must start with a wildcard.
          # scripts/armour-eval/cases: the Armour eval's bait code (#128), never run, so never tested.
          EXCLUDES: "**/lib/generated/** **/editrace_schema/models.py **/scripts/armour-eval/cases/**"
          BASELINE_JSON: coverage-base/summary.json
          EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/coverage-gate.sh
      - name: Update the Coverage comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMENT_FILE: coverage-out/summary.md
        run: .github/scripts/coverage-comment.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-out/summary.json
          retention-days: 30

  # Applies every migration to a fresh local database, loads the seed, and runs the RLS tests (#49). Only Postgres is
  # started: RLS lives in the database, and the API services would just add image pulls.
  supabase:
    needs: detect
    if: needs.detect.outputs.supabase == 'true' && needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset
      - run: supabase test db
      - run: .github/scripts/check-rls-tests.sh

  # Single required check for branch protection: fails if any job failed, ignores skipped ones.
  ci-ok:
    # A draft PR has no CI (see detect), so no ci-ok either; marking it ready runs everything.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || startsWith(github.head_ref, 'armour-eval/'))
    needs: [detect, scripts, web, python, coverage, supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # to show the final result in the Coverage comment
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
      # The coverage decision (#129). To exempt an under-covered PR the owner submits a review starting
      # `/coverage-exempt <reason>` and then re-runs this failed job (gh run rerun --failed <run-id>). The script
      # reads the PR's head commit, reviews and main's CODEOWNERS live, so the re-run sees the new review without
      # a new push. See .github/scripts/coverage-exemption.sh for the rules.
      - name: Check out the gate scripts
        if: github.event_name == 'pull_request' && needs.coverage.result == 'success'
        uses: actions/checkout@v6
      - name: Fetch the coverage summary
        if: github.event_name == 'pull_request' && needs.coverage.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary
      - name: Apply the coverage gate
        if: github.event_name == 'pull_request' && needs.coverage.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SUMMARY_JSON: coverage-summary/summary.json
        run: .github/scripts/coverage-decide.sh
