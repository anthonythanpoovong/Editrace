name: Discord PR status

# Pings people in Discord about their PR's status (#177), on top of discord-review-comment.yml
# (which pings the PR author about comments and requested changes):
#   - approval: the PR author is told who approved
#   - merged / closed without merge: the PR author is told who did it (not when they did it themselves)
#   - new commits pushed after an approval: the approvers are asked to review again
#   - the author re-requests a review (e.g. after addressing requested changes): that reviewer is pinged
#   - @mention or reply: anyone @mentioned (or whose inline comment was replied to) who is in
#     DISCORD_USER_MAP is pinged. The PR author is not pinged here; they already get the ping above.
# Bots (Armour) never ping. Not a required check and not part of ci-ok: a failed post shows as a red
# X and comments on the PR.
# Needs: secret DISCORD_REVIEW_WEBHOOK; variables DISCORD_REVIEW_ROLE_ID (fallback ping) and
# DISCORD_USER_MAP (JSON: GitHub login -> Discord user ID).
#
# The scripts always come from the default branch, never from the PR (same reason as
# discord-review-comment.yml), so a change to them only takes effect once merged. On
# pull_request_review and pull_request the workflow file itself still comes from the PR merge ref;
# same-repo PR authors have write access, which the repo treats as trusted (plan.md risks). On
# issue_comment the file is always main's, so conversation @mentions only work from the default branch.

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed, synchronize, review_requested]

permissions: {}

jobs:
  notify:
    # Same-repo PRs only for the pull_request* events (forks cannot read the secret). Comments:
    # pull requests only, not plain issues, and only a comment with an @ in it (the only thing it pings for, so
    # any other comment would start a runner for nothing). Always a human actor and a human PR author.
    if: >
      (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.review.user.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        contains(github.event.comment.body, '@') &&
        github.event.issue.user.type != 'Bot' &&
        github.event.comment.user.type != 'Bot'
      ) || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.sender.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action == 'closed' ||
         (github.event.action == 'synchronize' && !github.event.pull_request.draft) ||
         (github.event.action == 'review_requested' && github.event.requested_reviewer != null &&
          github.event.pull_request.state == 'open'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Trusted scripts only: the default branch, not the PR merge ref.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      # Comment text and the PR title are untrusted: they reach the scripts through env only.
      - name: Send the Discord pings
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_REVIEW_WEBHOOK }}
          ROLE_ID: ${{ vars.DISCORD_REVIEW_ROLE_ID }}
          USER_MAP: ${{ vars.DISCORD_USER_MAP }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          ACTOR: ${{ github.event.review.user.login || github.event.comment.user.login || github.event.sender.login }}
          URL: ${{ github.event.review.html_url || github.event.comment.html_url || github.event.pull_request.html_url }}
          BODY: ${{ github.event.review.body || github.event.comment.body }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_STATE: ${{ github.event.review.state }}
          MERGED: ${{ github.event.pull_request.merged }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REQUESTED: ${{ github.event.requested_reviewer.login }}
        run: .github/scripts/discord-pr-status.sh

  # Only this job can write to the PR. It runs only when the ping failed, so a dead webhook or a
  # bad map surfaces on the PR instead of as a status change nobody was told about.
  fallback:
    needs: notify
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$REPO" \
            --body "A Discord ping for this PR's status failed. Please tell the people involved directly. ([workflow run]($RUN_URL))"
