name: 🐛 Bug report
description: Something in Editrace isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 🐞 What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 🔁 Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 🧭 Area
      options:
        - Web app
        - Backend / API
        - Workers / detectors
        - Exporters / editor adapters
        - MCP server or Editrace Bridge
        - Assistant / retrieval
        - CI / tooling
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 💻 Environment
      description: Browser, OS, editor and version (e.g. Resolve 19.1), commit SHA if relevant.

  - type: textarea
    id: evidence
    attributes:
      label: 📎 Logs, screenshots or sample files
      description: Don't paste secrets, tokens or copyrighted audio.
